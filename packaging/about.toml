# Third-party notices for the installers (cargo-about, #162, DR 0016).
# Accepted licences: REQUIREMENTS §8.1, plus Unicode-3.0 and CC0-1.0, which
# the owner allowed (#33).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Only the targets the installers are built for (DR 0016, DR 0017): a dependency used only
# elsewhere is not shipped, so it needs no notice and is not checked. rustls-platform-verifier,
# for one, uses webpki-root-certs (CDLA-Permissive-2.0, outside §8.1) only on wasm32 (#184).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
