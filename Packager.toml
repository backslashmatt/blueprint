# Installers for the app, built by CI's `package` job (#162, DR 0016) with
# cargo-packager. Unsigned until the owner chooses signing (#159).
#
# Only the app is installed: `bp` is the headless front end for tests and
# benchmarks (REQUIREMENTS §5.3), and with it the install would exceed the
# 50 MB budget (§4). The binary is stripped before packaging.

name = "blueprint"
product-name = "Blueprint"
# Keep in step with `[workspace.package] version` (CI checks).
version = "0.1.0"
identifier = "io.github.backslashmatt.blueprint"
description = "Code review by architecture: a change shown as a change to the system's design."
authors = ["Blueprint developers"]
publisher = "Blueprint"
category = "DeveloperTool"
license-file = "LICENSE-MIT"
icons = ["packaging/icon.png"]
binaries-dir = "target/release"
out-dir = "target/packages"
binaries = [{ path = "blueprint", main = true }]
# The licences, and the third-party notices CI generates with cargo-about
# (packaging/about.toml) before packaging: the installers redistribute the
# app's crates, whose licences ask for their notices to go with it.
resources = [
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "target/notices/THIRD-PARTY-NOTICES.txt",
]

[deb]
# What the app links and loads at run time (ldd, and GPUI's Wayland, Vulkan
# and fontconfig loaders).
depends = [
    # Built on Ubuntu 24.04: the binary needs glibc 2.39 or newer.
    "libc6 (>= 2.39)",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libvulkan1",
    "libfontconfig1",
]
section = "devel"

[nsis]
# Per-user install: no administrator rights needed.
installMode = "currentUser"
# zlib, not the default LZMA, so the installer embeds no decompressor under a
# licence outside REQUIREMENTS §8.1.
compression = "zlib"
