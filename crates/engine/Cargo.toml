[package]
name = "blueprint-engine"
description = "Headless engine: indexing, incremental queries, git, storage, diffing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blueprint-model.workspace = true
blueprint-protocol.workspace = true
blueprint-lang-rust.workspace = true
blueprint-lang-ts.workspace = true
blueprint-lang-csharp.workspace = true
blueprint-store.workspace = true
directories = "6"
gix = { workspace = true }
# Line diffs for change weight (DR 0008 decision 6). Apache-2.0.
imara-diff = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[lints]
workspace = true

