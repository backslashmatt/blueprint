[package]
name = "blueprint-store-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
blueprint-store = { path = ".." }

# Kept out of the main workspace: cargo-fuzz needs nightly Rust.
[workspace]

[[bin]]
name = "segment"
path = "fuzz_targets/segment.rs"
test = false
doc = false
bench = false
