[package]
name = "blueprint-cli"
description = "Headless front end: index, diff, and dump the model as JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bp"
path = "src/main.rs"

[dependencies]
blueprint-engine.workspace = true
blueprint-model.workspace = true
blueprint-protocol.workspace = true
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1"

[lints]
workspace = true
