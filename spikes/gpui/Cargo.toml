[package]
name = "gpui-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway M0 spike (issue #13): can GPUI meet the REQUIREMENTS §4 rendering budgets?"
license = "MIT OR Apache-2.0"

# Standalone: not part of the product workspace.
[workspace]

[dependencies]
gpui = "=0.2.2"
memory-stats = "1"
env_logger = "0.11"

[profile.release]
debug = "line-tables-only"

# xattr 0.2.3 (via gpui 0.2.2 -> gpui_http_client -> zed-async-tar) uses libc::ENOATTR, which
# current libc no longer defines on Linux, where it equals ENODATA. One-line spike-only patch.
[patch.crates-io]
xattr = { path = "patches/xattr" }
