[package]
name = "gpui-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway M0 spike (issue #13): can GPUI meet the REQUIREMENTS §4 rendering budgets?"
license = "MIT OR Apache-2.0"

# Standalone: not part of the product workspace.
[workspace]

[dependencies]
# GPUI from Zed's main branch, pinned: the crates.io release (0.2.2, Oct 2025) has no
# accessibility support (issue #13). All Zed crates reached are Apache-2.0.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e2f00a41ac6789f0ae52b229567ad5715266e400" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e2f00a41ac6789f0ae52b229567ad5715266e400", features = ["font-kit", "wayland", "x11"] }
memory-stats = "1"
env_logger = "0.11"

[profile.release]
debug = "line-tables-only"

