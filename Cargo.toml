[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/engine",
    "crates/store",
    "crates/protocol",
    "crates/cli",
    "crates/ui",
    "crates/app",
    "bench",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
blueprint-model = { path = "crates/model" }
blueprint-engine = { path = "crates/engine" }
blueprint-store = { path = "crates/store" }
blueprint-protocol = { path = "crates/protocol" }
blueprint-ui = { path = "crates/ui" }

[workspace.lints.rust]
# rustc rejects any attempt to allow it. The one exception, crates/store,
# declares its own copy of these lints with `deny`; xtask checks that copy
# (REQUIREMENTS §5.3).
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
