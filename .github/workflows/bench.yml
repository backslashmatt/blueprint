# Benchmarks (REQUIREMENTS §9.3). Every run builds the commit under test and its base
# (the PR's base, or the previous main commit on a push) and measures both on the same
# runner, interleaved, then checks the section 4 budgets. Method: docs/decisions/0002.
name: Bench

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners: GitHub-hosted by default. Setting the repository variable LINUX_RUNNER (or
# WINDOWS_RUNNER) to a self-hosted runner's label, such as `self-hosted`, moves those jobs onto
# it without changing this file (#122).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The PR's base, or the main commit before this push. Empty for a manual run.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  bench:
    name: bench (linux x64)
    # The fixed runner class (DR 0002).
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    # Two cold release builds (fat LTO, the app included) can take 40 min on their own.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install the app's libraries and a headless display (see docs/building.md)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan1 mesa-vulkan-drivers xvfb openbox
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the commit under test
        run: |
          cargo build --release --locked -p blueprint-cli -p blueprint-bench -p blueprint-app
          ls -l target/release/blueprint
      - name: Build the base commit
        id: base
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit; budgets only."; exit 0
          fi
          git fetch --quiet --depth 1 origin "$BASE_SHA"
          git worktree add --detach ../base "$BASE_SHA"
          args="--base-bp target/base/release/bp --base-commit $BASE_SHA"
          # The app's cold start is compared too once the base has the app (#88).
          if [ -f ../base/crates/app/src/main.rs ]; then
            pkgs="-p blueprint-cli -p blueprint-app"
            args="$args --base-app target/base/release/blueprint"
          else
            pkgs="-p blueprint-cli"
          fi
          (cd ../base && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/base" cargo build --release --locked $pkgs)
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Cache reference repositories
        uses: actions/cache@v4
        with:
          path: bench/repos
          key: refrepos-v3-${{ hashFiles('bench/repos.json') }}
      - name: Fetch reference repositories (read only; nothing in them is run)
        run: target/release/bp-bench fetch
      # The app's cold start runs under Xvfb with software Vulkan: no GPU on this runner class.
      - name: Run benchmarks
        run: >
          spikes/gpui/xvfb-run.sh
          target/release/bp-bench run --bp target/release/bp --app target/release/blueprint
          ${{ steps.base.outputs.args }}
          --commit ${{ github.sha }} --out bench-results.json --summary bench-summary.md
      - name: Publish table to the job summary
        if: always()
        run: cat bench-summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No summary was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            bench-results.json
            bench-summary.md
          if-no-files-found: warn
