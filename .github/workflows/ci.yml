# CI for every change (REQUIREMENTS §9.1): fmt once, clippy and tests on every platform, and tests
# on Fedora as well as Ubuntu (§5.1, #37).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded PR runs are cancelled to save minutes (see issue #15).
concurrency:
  # PR runs share a group per branch, so a new push cancels the old run. Pushes to main get a group
  # per commit, so every commit on main is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners: GitHub-hosted by default. Setting the repository variable LINUX_RUNNER (or
# WINDOWS_RUNNER) to a self-hosted runner's label moves pushes and manual runs onto it without
# changing this file (#122). Use a label that names one machine and its OS, not the generic
# `self-hosted`, so Linux and Windows jobs cannot land on each other's runner. Pull requests
# always run on GitHub-hosted runners: the repository is public, and a fork's code must never
# run on a self-hosted machine.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ${{ github.event_name != 'pull_request' && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        # A self-hosted runner's service may not have ~/.cargo/bin on its PATH (#122).
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          # On Windows, bash's PATH takes /c/... and GITHUB_PATH takes C:\...
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          if [ -d "$bin" ]; then
            export PATH="$bin:$PATH"
            if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          fi
          rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is deferred by the owner (#15, DR 0004); reinstate by adding macos-latest back.
        # Ubuntu is pinned to the current LTS, the named Linux target (§5.1, #37).
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os == 'windows-latest' && (github.event_name != 'pull_request' && vars.WINDOWS_RUNNER || 'windows-latest') || (github.event_name != 'pull_request' && vars.LINUX_RUNNER || matrix.os) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The app test reviews this repository's last change.
          fetch-depth: 2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        # A self-hosted runner's service may not have ~/.cargo/bin on its PATH (#122).
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          # On Windows, bash's PATH takes /c/... and GITHUB_PATH takes C:\...
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          if [ -d "$bin" ]; then
            export PATH="$bin:$PATH"
            if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          fi
          rustup toolchain install
      - name: Install the app's libraries and a headless display (see docs/building.md)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan1 mesa-vulkan-drivers xvfb openbox \
            imagemagick
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-features --locked
      # The app opens its window, paints one frame and quits (#88). No real GPU on these runners.
      - name: app smoke run
        shell: bash
        run: |
          # The same features as clippy and test, so the app reuses their build of gpui.
          cargo build --locked -p blueprint-app --all-features
          if [ "$RUNNER_OS" = Linux ]; then
            timeout 120 spikes/gpui/xvfb-run.sh target/debug/blueprint --cold-start-report cold-start.json
          else
            timeout 120 target/debug/blueprint --cold-start-report cold-start.json
          fi
          cat cold-start.json
      # The app test of #90: open this repository, choose two commits by keyboard, reach the review.
      - name: app review by keyboard
        shell: bash
        run: |
          # Base: the last row (the oldest commit listed); head: the first (a ref at HEAD).
          keys=end,b,home,h,enter
          if [ "$RUNNER_OS" = Linux ]; then
            timeout 300 spikes/gpui/xvfb-run.sh target/debug/blueprint . --script $keys --review-report review.json
          else
            timeout 300 target/debug/blueprint . --script $keys --review-report review.json
          fi
          cat review.json
          if grep -q '"base": "\([0-9a-f]*\)", "head": "\1"' review.json; then
            echo "the keys chose the same commit as base and head"; exit 1
          fi
          if grep -q '"map_nodes": 0' review.json; then
            echo "the map is empty"; exit 1
          fi
      # The same review through the command palette alone (#94): open it with F1,
      # search, run; then drill once and open the selected node's code.
      - name: app review by command palette
        shell: bash
        run: |
          keys=end,b,home,h,f1,b,a,s,e,space,a,g,enter,m,enter,f1,o,p,e,n,space,t,h,e,enter
          if [ "$RUNNER_OS" = Linux ]; then
            timeout 300 spikes/gpui/xvfb-run.sh target/debug/blueprint . --script $keys --review-report palette.json
          else
            timeout 300 target/debug/blueprint . --script $keys --review-report palette.json
          fi
          cat palette.json
          if grep -q '"base": "\([0-9a-f]*\)", "head": "\1"' palette.json; then
            echo "the palette chose the same commit as base and head"; exit 1
          fi
          if grep -q '"code_rows": 0' palette.json; then
            echo "the palette did not reach the code"; exit 1
          fi
      # Screenshots of the map from the virtual display, for review (§9.4).
      - name: map screenshots
        if: runner.os == 'Linux'
        run: |
          mkdir -p screenshots
          timeout 600 .github/scripts/screenshot.sh screenshots/findings.png 240 target/debug/blueprint . --script end,b,home,h,enter
          timeout 600 .github/scripts/screenshot.sh screenshots/map-systems.png 240 target/debug/blueprint . --script end,b,home,h,enter,m
          timeout 600 .github/scripts/screenshot.sh screenshots/map-drilled.png 240 target/debug/blueprint . --script end,b,home,h,enter,m,enter
          timeout 600 .github/scripts/screenshot.sh screenshots/code.png 240 target/debug/blueprint . --script end,b,home,h,enter,m,enter,c
          timeout 600 .github/scripts/screenshot.sh screenshots/palette.png 240 target/debug/blueprint . --script end,b,home,h,enter,m,enter,f1,c,o,d,e
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

  # Fedora, the other named Linux target (§5.1, #37), in a container on the Linux runner. Clippy
  # already runs on Ubuntu, so this job only builds and tests. Move the tag to each new Fedora
  # release; `latest` is not used, so a release never changes CI unannounced.

  # Unsigned installers (#162, DR 0016): the app alone, stripped, packaged by cargo-packager
  # (Packager.toml), with its installed size checked against the 50 MB budget (§4). The packages
  # are workflow artifacts, not releases: publishing and signing wait on the owner (#159), and
  # macOS packages on macOS CI (#133).
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # linuxdeploy is itself an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Install the app's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Packager.toml and the workspace agree on the version
        shell: bash
        run: |
          ws=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          pk=$(sed -n 's/^version = "\(.*\)"/\1/p' Packager.toml)
          echo "workspace $ws, Packager.toml $pk"
          test -n "$ws" && test "$ws" = "$pk"
      - name: Build the app
        run: cargo build --release --locked -p blueprint-app
      - name: Strip the app
        if: runner.os == 'Linux'
        run: strip target/release/blueprint
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then formats=deb,appimage; else formats=nsis; fi
          cargo packager --release --formats "$formats"
          ls -l target/packages
      # The budget is the installed size: what the installer puts on disk.
      - name: Installed size (Linux)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls target/packages/*.deb)
          mkdir -p installed && dpkg-deb -x "$deb" installed
          bytes=$(du -sb installed | cut -f1)
          image=$(ls target/packages/*.AppImage)
          image_bytes=$(stat -c %s "$image")
          .github/scripts/installed_size.sh deb "$bytes"
          .github/scripts/installed_size.sh AppImage "$image_bytes"
      - name: Installed size (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/packages/*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'blueprint-installed'
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir"
          $bytes = (Get-ChildItem -Recurse -File $dir | Measure-Object Length -Sum).Sum
          Get-ChildItem -Recurse -File $dir | Select-Object FullName, Length | Format-Table -AutoSize
          bash .github/scripts/installed_size.sh NSIS $bytes
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.exe
          if-no-files-found: error

  # The §4 interaction budgets on Windows (#95): a release build runs the timed session that
  # bp-bench runs on Linux, on this repository, and the budgets are checked.
  ui-timings:
    name: ui timings (windows-latest)
    runs-on: ${{ github.event_name != 'pull_request' && vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        # A self-hosted runner's service may not have ~/.cargo/bin on its PATH (#122).
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          # On Windows, bash's PATH takes /c/... and GITHUB_PATH takes C:\...
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          if [ -d "$bin" ]; then
            export PATH="$bin:$PATH"
            if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          fi
          rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the app (release)
        run: cargo build --release --locked -p blueprint-app
      - name: timed session
        shell: bash
        run: .github/scripts/ui-timings.sh

  # The same session under a headless Wayland compositor (#95, #37): cage on wlroots' headless
  # backend, with software rendering. DISPLAY is cleared for the app so it cannot fall back to
  # Xwayland.
  ui-timings-wayland:
    name: ui timings (wayland, ubuntu-24.04)
    runs-on: ${{ github.event_name != 'pull_request' && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        # A self-hosted runner's service may not have ~/.cargo/bin on its PATH (#122).
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          # On Windows, bash's PATH takes /c/... and GITHUB_PATH takes C:\...
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          if [ -d "$bin" ]; then
            export PATH="$bin:$PATH"
            if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          fi
          rustup toolchain install
      - name: Install the app's libraries and a headless compositor
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan1 mesa-vulkan-drivers cage
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the app (release)
        run: cargo build --release --locked -p blueprint-app
      - name: timed session
        env:
          WLR_BACKENDS: headless
          WLR_RENDERER: pixman
          WLR_LIBINPUT_NO_DEVICES: "1"
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          .github/scripts/ui-timings.sh cage -- env -u DISPLAY

  # Input-to-present latency from real key events (#32), reported but not gated: these runners
  # have no GPU, so presenting means lavapipe rasterizing the window on the CPU, which is most
  # of the number (docs/app.md, Latency). The §4 check needs real hardware (#96).
  input-latency:
    name: input latency (x11, ubuntu-24.04, informational)
    runs-on: ${{ github.event_name != 'pull_request' && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    # Reported, never failing the run.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        # A self-hosted runner's service may not have ~/.cargo/bin on its PATH (#122).
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          # On Windows, bash's PATH takes /c/... and GITHUB_PATH takes C:\...
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          if [ -d "$bin" ]; then
            export PATH="$bin:$PATH"
            if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          fi
          rustup toolchain install
      - name: Install the app's libraries, a headless display and xdotool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan1 mesa-vulkan-drivers xvfb openbox \
            xdotool
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-app-latency
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the instrumented app (release, latency feature)
        run: cargo build --release --locked -p blueprint-app --features latency
      - name: real key events to presented frames
        run: |
          timeout 300 .github/scripts/input-latency.sh target/release/blueprint latency.json 60 || true
          {
            echo "### Input to present (Xvfb, lavapipe; not gated)"
            echo '```json'
            cat latency.json 2>/dev/null || echo '{"result": "none: the app did not report"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  exit-test:
    # The M4 exit test (REQUIREMENTS §6, #119): a review of one of the agent's own pull
    # requests (#120, the findings view, as squash-merged into main: 1169157..9786f40), end
    # to end with the keyboard only, exported as Markdown. It keeps the keyboard-only review
    # path from regressing.
    name: M4 exit test (keyboard-only review, ubuntu-24.04)
    runs-on: ${{ github.event_name != 'pull_request' && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # The reviewed pull request's base and head are older than a shallow checkout.
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        # A self-hosted runner's service may not have ~/.cargo/bin on its PATH (#122).
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          # On Windows, bash's PATH takes /c/... and GITHUB_PATH takes C:\...
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          if [ -d "$bin" ]; then
            export PATH="$bin:$PATH"
            if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          fi
          rustup toolchain install
      - name: Install the app's libraries and a headless display (see docs/building.md)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libvulkan1 mesa-vulkan-drivers xvfb openbox \
            at-spi2-core gir1.2-atspi-2.0 python3-gi dbus
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-app-exit-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the app (release)
        run: cargo build --release --locked -p blueprint-app
      - name: review #120 by keyboard and export it
        run: |
          .github/scripts/exit-test.sh \
            1169157cbbb84878313606449cb3d59b71b9e2df 9786f409587a9a0295377c9a6c790808106d54a2 \
            spikes/gpui/xvfb-run.sh
          {
            echo "### M4 exit test: the exported review of #120"
            echo
            cat exit-review.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: every view labelled for screen readers, read through AT-SPI (#118)
        run: |
          .github/scripts/a11y-tree.sh \
            1169157cbbb84878313606449cb3d59b71b9e2df 9786f409587a9a0295377c9a6c790808106d54a2 \
            spikes/gpui/xvfb-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-review
          path: |
            exit-review.json
            exit-review.md
          if-no-files-found: warn

  exit-test-windows:
    # The same M4 exit test on Windows (REQUIREMENTS §6: every platform), in Git Bash.
    name: M4 exit test (keyboard-only review, windows-latest)
    runs-on: ${{ github.event_name != 'pull_request' && vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # The reviewed pull request's base and head are older than a shallow checkout.
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        # A self-hosted runner's service may not have ~/.cargo/bin on its PATH (#122).
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          # On Windows, bash's PATH takes /c/... and GITHUB_PATH takes C:\...
          if command -v cygpath >/dev/null; then bin="$(cygpath -u "$bin")"; fi
          if [ -d "$bin" ]; then
            export PATH="$bin:$PATH"
            if command -v cygpath >/dev/null; then cygpath -w "$bin"; else echo "$bin"; fi >> "$GITHUB_PATH"
          fi
          rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the app (release)
        run: cargo build --release --locked -p blueprint-app
      - name: review #120 by keyboard and export it
        shell: bash
        run: |
          .github/scripts/exit-test.sh \
            1169157cbbb84878313606449cb3d59b71b9e2df 9786f409587a9a0295377c9a6c790808106d54a2
          {
            echo "### M4 exit test on Windows: the exported review of #120"
            echo
            cat exit-review.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-review-windows
          path: |
            exit-review.json
            exit-review.md
          if-no-files-found: warn

  fedora:
    name: test (fedora-45)
    runs-on: ${{ github.event_name != 'pull_request' && vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    container: fedora:45
    timeout-minutes: 30
    steps:
      - name: Install build dependencies (see docs/building.md)
        run: >
          dnf install -y -q gcc git rustup libxkbcommon-devel libxkbcommon-x11-devel wayland-devel
          libX11-devel libxcb-devel fontconfig-devel vulkan-loader mesa-vulkan-drivers
          xorg-x11-server-Xvfb openbox procps-ng
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Trust the checkout (the container runs as root; the runner owns the files)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup-init -y -q --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        run: cargo test --workspace --all-features --locked
      - name: app smoke run
        run: |
          # The same features as clippy and test, so the app reuses their build of gpui.
          cargo build --locked -p blueprint-app --all-features
          timeout 120 spikes/gpui/xvfb-run.sh target/debug/blueprint --cold-start-report cold-start.json
          cat cold-start.json
      - name: app review by keyboard
        run: |
          timeout 300 spikes/gpui/xvfb-run.sh target/debug/blueprint . --script end,b,home,h,enter --review-report review.json
          cat review.json
          if grep -q '"base": "\([0-9a-f]*\)", "head": "\1"' review.json; then
            echo "the keys chose the same commit as base and head"; exit 1
          fi
          if grep -q '"map_nodes": 0' review.json; then
            echo "the map is empty"; exit 1
          fi
      - name: app review by command palette
        run: |
          timeout 300 spikes/gpui/xvfb-run.sh target/debug/blueprint . --script end,b,home,h,f1,b,a,s,e,space,a,g,enter,m,enter,f1,o,p,e,n,space,t,h,e,enter --review-report palette.json
          cat palette.json
          if grep -q '"base": "\([0-9a-f]*\)", "head": "\1"' palette.json; then
            echo "the palette chose the same commit as base and head"; exit 1
          fi
          if grep -q '"code_rows": 0' palette.json; then
            echo "the palette did not reach the code"; exit 1
          fi
      # The container runs as root. On a reused (self-hosted) runner, files it leaves in the
      # workspace would belong to root and stop the next job's checkout from cleaning up (#127):
      # give them back to the runner's user, whatever happened above.
      - name: Give the workspace back to the runner's user
        if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"
