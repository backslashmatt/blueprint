# CI for every change (REQUIREMENTS §9.1): fmt once, clippy and tests on all three platforms.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded PR runs are cancelled to save minutes (see issue #15).
concurrency:
  # PR runs share a group per branch, so a new push cancels the old run. Pushes to main get a group
  # per commit, so every commit on main is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is deferred by the owner (#15, DR 0004); reinstate by adding macos-latest back.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-features --locked
