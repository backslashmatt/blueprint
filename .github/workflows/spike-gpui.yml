# M0 UI toolkit spike (issue #13): builds and runs spikes/gpui on every platform, and on
# Fedora as well as Ubuntu (#37), recording metrics and a screenshot of each scene. Runs only
# when the spike changes.
name: Spike GPUI

on:
  pull_request:
    paths: ["spikes/gpui/**", ".github/workflows/spike-gpui.yml"]
  workflow_dispatch:

concurrency:
  group: spike-gpui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # GPUI comes from Zed's git repository; the git CLI fetches it more reliably than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  spike:
    name: spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS deferred by the owner (#15, DR 0004).
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: spikes/gpui
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/gpui
      - name: Linux packages (software Vulkan, Xvfb, window manager)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 xvfb openbox x11-apps imagemagick \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev
      - name: Build
        run: cargo build --release --locked
      - name: Run scenes
        env:
          RUST_LOG: warn
        run: ./run-scenes.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### GPUI spike on ${{ matrix.os }}"
            echo
            echo "Binary size: $(du -h target/release/gpui-spike* 2>/dev/null | head -1 | cut -f1)"
            echo
            for f in out/*.json; do echo "- \`$(basename $f)\`: \`$(cat $f)\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-gpui-${{ matrix.os }}
          path: spikes/gpui/out/

  # Fedora, the other named Linux target (§5.1, #37), in a container on the Linux runner.
  # The same scenes under Xvfb and openbox with software Vulkan; package names are in
  # docs/building.md.
  spike-fedora:
    name: spike (fedora-45)
    runs-on: ubuntu-24.04
    container: fedora:45
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: spikes/gpui
    steps:
      - name: Fedora packages (toolchain, software Vulkan, Xvfb, window manager, fonts)
        working-directory: /
        run: |
          dnf install -y -q gcc gcc-c++ git rustup procps-ng findutils \
            mesa-vulkan-drivers vulkan-loader xorg-x11-server-Xvfb openbox xwd ImageMagick \
            libxkbcommon-devel libxkbcommon-x11-devel wayland-devel libX11-devel libxcb-devel \
            fontconfig-devel dejavu-sans-mono-fonts
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rustup-init -y -q --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/gpui
      - name: Build
        run: cargo build --release --locked
      - name: Run scenes
        env:
          RUST_LOG: warn
          RUNNER_OS: Linux
        run: ./run-scenes.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### GPUI spike on fedora-45"
            echo
            echo "Binary size: $(du -h target/release/gpui-spike 2>/dev/null | head -1 | cut -f1)"
            echo
            for f in out/*.json; do echo "- \`$(basename $f)\`: \`$(cat $f)\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-gpui-fedora-45
          path: spikes/gpui/out/
