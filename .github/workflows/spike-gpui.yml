# M0 UI toolkit spike (issue #13): builds and runs spikes/gpui on all three platforms,
# recording metrics and a screenshot of each scene. Runs only when the spike changes.
name: Spike GPUI

on:
  pull_request:
    paths: ["spikes/gpui/**", ".github/workflows/spike-gpui.yml"]
  workflow_dispatch:

concurrency:
  group: spike-gpui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  spike:
    name: spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: spikes/gpui
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/gpui
      - name: Linux packages (software Vulkan, Xvfb, window manager)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers libvulkan1 xvfb openbox x11-apps imagemagick \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev
      - name: Build
        run: cargo build --release --locked
      - name: Run scenes
        env:
          RUST_LOG: warn
        run: |
          mkdir -p out
          bin=target/release/gpui-spike
          for scene in graph text; do
            for variant in default quads; do
              [ "$scene" = text ] && [ "$variant" = quads ] && continue
              name="$scene-$variant"
              extra=""; [ "$variant" = quads ] && extra="SPIKE_EDGES_QUADS=1"
              case "$RUNNER_OS" in
                Linux)
                  (env $extra timeout 180 ./xvfb-run.sh sh -c "$bin $scene --out out/$name.json --hold-ms 4000 & pid=\$!; \
                    while [ ! -f out/$name.json ]; do sleep 0.2; done; sleep 1; \
                    xwd -root -display :99 | convert xwd:- out/$name.png; wait \$pid") || echo "::warning::$name failed"
                  ;;
                macOS)
                  env $extra $bin $scene --out out/$name.json --hold-ms 4000 & pid=$!
                  for i in $(seq 1 600); do [ -f out/$name.json ] && break; sleep 0.2; done
                  sleep 1; screencapture -x out/$name.png || echo "::warning::screencapture failed"
                  wait $pid || echo "::warning::$name failed"
                  ;;
                Windows)
                  env $extra $bin.exe $scene --out out/$name.json --hold-ms 4000 & pid=$!
                  for i in $(seq 1 600); do [ -f out/$name.json ] && break; sleep 0.2; done
                  sleep 1
                  powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \
                    \$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$i=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \
                    \$g=[System.Drawing.Graphics]::FromImage(\$i); \$g.CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \
                    \$i.Save('out/$name.png')" || echo "::warning::screenshot failed"
                  wait $pid || echo "::warning::$name failed"
                  ;;
              esac
              if [ -f out/$name.json ]; then echo "$name: $(cat out/$name.json)"; else echo "::warning::$name wrote no metrics"; fi
            done
          done
          ls -la target/release/gpui-spike* | head -3
      - name: Summary
        if: always()
        run: |
          {
            echo "### GPUI spike on ${{ matrix.os }}"
            echo
            echo "Binary size: $(du -h target/release/gpui-spike* 2>/dev/null | head -1 | cut -f1)"
            echo
            for f in out/*.json; do echo "- \`$(basename $f)\`: \`$(cat $f)\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-gpui-${{ matrix.os }}
          path: spikes/gpui/out/
